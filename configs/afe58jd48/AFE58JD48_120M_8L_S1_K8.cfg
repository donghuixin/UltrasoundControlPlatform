// Overlay for the TI 120-MSPS / 8-lane / no-demod quick-start.
// Purpose: align the AFE multiframe length with the HSDC M16_FIXED profile.
// Apply only after LMK and AFE initialization and after loading the TI
// "JESD 120MSPS_Subclass1_8L" quick-start script.
// Read back BOTH dies before capture:
//   0x31=0x02C0, 0x34=0x0907, 0x35=0x03C0, 0x36=0x0007.
AFE58JD48_GLOBAL|0x12	0x000A
AFE58JD48_Common_DIG|0x31	0x02C0
AFE58JD48_Common_DIG|0x34	0x0907
AFE58JD48_Common_DIG|0x35	0x03C0
AFE58JD48_Common_DIG|0x36	0x0007
AFE58JD48_GLOBAL|0x12	0x0000
